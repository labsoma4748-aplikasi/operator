<script>
/* ====== ISI DENGAN DATA SUPABASE ANDA (Project Settings > API) ====== */
const SUPABASE_URL='https://dtajuakgzpjfajwpsspg.supabase.co', SUPABASE_KEY='sb_publishable_Pw4nFq4gs4CSOaf-aoNrVw_CR8FdQ-K';
/* =================================================================== */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const S={user:null,role:'',santri:[],phones:[],active:[],cfg:{quota:2,limit_min:5,warn_min:4},off:0,tab:'dash',alerted:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>Date.now()+S.off;
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const BH=['Muharam','Safar','Rabiulawal','Rabiulakhir','Jumadilawal','Jumadilakhir','Rajab','Syakban','Ramadan','Syawal','Zulkaidah','Zulhijah'],DAY=864e5,TZ=7*36e5;
let HF;try{HF=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric',timeZone:'Asia/Jakarta'})}catch(e){HF=new Intl.DateTimeFormat('en-u-ca-islamic',{day:'numeric',month:'numeric',year:'numeric',timeZone:'Asia/Jakarta'})}
const hij=t=>{const p={};HF.formatToParts(new Date(+new Date(t)+(S.cfg.hijri_offset||0)*DAY)).forEach(x=>p[x.type]=x.value);return {y:parseInt(p.year),m:+p.month,d:+p.day}};
const mid=t=>Math.floor((+t+TZ)/DAY)*DAY-TZ;
function fromHij(y,m,d){const c=mid(Date.UTC(622,6,19)+((y-1)*354.367+(m-1)*29.53+d-1)*DAY);for(let k=-6;k<=6;k++){const t=c+k*DAY,h=hij(t);if(h.y===y&&h.m===m&&h.d===d)return t}return null}
const monthStart=()=>{const h=hij(now());return new Date(fromHij(h.y,h.m,1))};
const hariN=t=>new Date(t).toLocaleDateString('id-ID',{weekday:'long',timeZone:'Asia/Jakarta'});
const fmtH=t=>{const h=hij(t);return `${h.d} ${BH[h.m-1]} ${h.y} H`};
const jam=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}).replace(':','.');
const tgl=t=>fmtH(t)+', '+jam(t);
function hPick(id,day,def){const h=hij(now());return (day?`<select id="${id}d"><option value="">Hari</option>${[...Array(30)].map((_,i)=>`<option>${i+1}</option>`).join('')}</select>`:'')+
 `<select id="${id}m">${def?'':'<option value="">Bulan</option>'}${BH.map((n,i)=>`<option value="${i+1}" ${def&&h.m===i+1?'selected':''}>${n}</option>`).join('')}</select><select id="${id}y">${def?'':'<option value="">Tahun</option>'}${[h.y-2,h.y-1,h.y,h.y+1].map(y=>`<option ${def&&y===h.y?'selected':''}>${y}</option>`).join('')}</select>`}
function hRange(id){const g=k=>{const e=document.getElementById(id+k);return e&&e.value?+e.value:0};let y=g('y'),m=g('m'),d=g('d');if(!y&&!m&&!d)return null;if(!y)y=hij(now()).y;
 if(m&&d){const a=fromHij(y,m,d);if(a!=null)return [a,a+DAY]}
 if(m)return [fromHij(y,m,1),m===12?fromHij(y+1,1,1):fromHij(y,m+1,1)];return [fromHij(y,1,1),fromHij(y+1,1,1)]}

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4000)}
let ac;function beep(n=3){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*.45;g.gain.setValueAtTime(.4,t);g.gain.setValueAtTime(0,t+.3);o.start(t);o.stop(t+.32)}}catch(e){}}
async function audit(aksi,detail){await sb.from('audit').insert({admin_email:S.user.email,aksi,detail})}
function csv(rows,name){const c=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download=name;a.click()}

/* ---------- LOGIN ---------- */
function loginView(){$('#app').innerHTML=`<div class="lg"><div class="lgL"><div class="brand"><span class="logo">${ic('phone')}</span><div><b>KADA</b><small>Telepon Santri</small></div></div>
<div><h1>Telepon santri, tertata dan terpantau.</h1><p>Jatah, durasi, dan riwayat panggilan dikelola dalam satu tempat.</p></div><small style="color:#7f9a90">Sistem administrasi telepon santri</small></div>
<div class="lgR"><div class="lgF"><h2>Masuk</h2><p class="mu" style="margin:4px 0 14px">Gunakan akun Admin atau akun HP.</p>
<label class="mu">Username<input id="u" autocapitalize="none" autocomplete="username"></label><label class="mu">Password<input id="p" type="password" autocomplete="current-password"></label>
<p id="err" style="color:var(--rd);margin:8px 0 0;min-height:20px"></p><button onclick="login()">Masuk</button></div></div></div>`;$('#p').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){const u=$('#u').value.trim(),email=mail(u);
 const {error}=await sb.auth.signInWithPassword({email,password:$('#p').value});
 if(error){$('#err').textContent=/confirm/i.test(error.message)?'Akun belum dikonfirmasi di Supabase':'Username atau password salah';return}S.armed=true;arm();wake();beep(1);boot()}
async function logout(){await sb.auth.signOut();location.reload()}

/* ---------- BOOT & DATA ---------- */
async function boot(){
 const {data:{session}}=await sb.auth.getSession();const user=session&&session.user;if(!user)return loginView();S.user=user;
 const [t,pr]=await Promise.all([sb.rpc('server_now'),sb.from('profiles').select('role,daerah').eq('user_id',user.id).maybeSingle()]);
 if(t.data)S.off=new Date(t.data)-Date.now();
 if(!pr.data){$('#app').innerHTML='<div class="tm"><h2>Akun belum punya peran</h2><p>Hubungi admin pusat.</p><button class="sec" onclick="logout()">Keluar</button></div>';return}
 S.role=pr.data.role;S.daerah=pr.data.daerah;await loadBase();
 sb.channel('calls').on('postgres_changes',{event:'*',schema:'public',table:'calls'},()=>refreshActive()).subscribe();
 setInterval(refreshActive,15000);setInterval(tick,1000);
 S.on=new Set();
 if(S.role==='terminal'){const p=myPhone();if(p){const ping=()=>sb.from('phones').update({last_seen:new Date(now()).toISOString()}).eq('id',p.id);ping();setInterval(ping,20000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')ping()});
  S.pch=sb.channel('hp-presence',{config:{presence:{key:String(p.id)}}});S.pch.subscribe(st=>{if(st==='SUBSCRIBED')S.pch.track({at:Date.now()})})}}
 else{const ch=sb.channel('hp-presence');ch.on('presence',{event:'sync'},()=>{S.on=new Set(Object.keys(ch.presenceState()));const g=sig();if(g!==S.sig){S.sig=g;if(S.tab==='dash')render()}}).subscribe()}
 render()}
const myPhone=()=>S.phones.find(p=>p.email===S.user.email);
async function loadBase(){
 const [c,p,a]=await Promise.all([sb.from('settings').select('*').eq('id',1).single(),sb.from('phones').select('*').eq('aktif',true).order('id'),sb.from('calls').select('*,santri(nama,kamar),phones(nama)').eq('status','aktif')]);
 if(c.data)S.cfg=c.data;S.phones=p.data||[];S.active=a.data||[];S.sig=sig()}
const isOn=p=>(S.on&&S.on.has(String(p.id)))||!!(p.last_seen&&now()-new Date(p.last_seen)<75000);
const sig=()=>S.active.map(c=>c.id+c.status).join()+'|'+S.phones.map(p=>isOn(p)?1:0).join();
/* Layar hanya digambar ulang jika status HP benar-benar berubah, dan hanya di Dashboard/HP terminal. Tab lain & isian form tidak tersentuh. */
async function refreshActive(quiet){
 const {data}=await sb.from('calls').select('*,santri(nama,kamar),phones(nama)').eq('status','aktif');if(data)S.active=data;
 if(S.role!=='terminal'){const {data:p}=await sb.from('phones').select('*').eq('aktif',true).order('id');if(p)S.phones=p}
 const g=sig();if(quiet){S.sig=g;return}
 if(g!==S.sig){S.sig=g;if(S.role==='terminal'||S.tab==='dash')render()}}

/* ---------- RENDER ---------- */
const IC={dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
santri:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
riwayat:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',rekap:'<path d="M3 3v18h18M7 16V9M12 16V5M17 16v-4"/>',
akun:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',plus:'<path d="M12 5v14M5 12h14"/>',ok:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const hd=(t,sub,b='')=>`<div class="hd"><div><h1>${t}</h1><p>${sub}</p></div>${b}</div>`;

const wavURL=(a,R)=>{const h=new DataView(new ArrayBuffer(44)),w=(o,t)=>[...t].forEach((c,i)=>h.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');h.setUint32(4,36+a.length,true);w(8,'WAVEfmt ');h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,1,true);h.setUint32(24,R,true);h.setUint32(28,R,true);h.setUint16(32,1,true);h.setUint16(34,8,true);w(36,'data');h.setUint32(40,a.length,true);
 return URL.createObjectURL(new Blob([h,a],{type:'audio/wav'}))};
/* Satu file audio: hening sampai batas waktu, lalu bunyi beep berulang. Diputar sejak telepon dimulai sehingga tetap berjalan sebagai pemutar media saat aplikasi lain dibuka. */
function mkAlarm(limit,warn){const R=4000,tot=Math.ceil(limit)+90,a=new Uint8Array(R*tot).fill(128);for(let i=0;i<a.length;i+=2)a[i]=129;
 const beep=(t0,d)=>{for(let i=0;i<R*d;i++){const n=Math.floor(t0*R)+i;if(n<a.length)a[n]=128+(Math.sin(2*Math.PI*1000*i/R)>=0?115:-115)}};
 if(warn<limit)beep(warn,.4);for(let t=limit;t<tot-1;t+=.6)beep(t,.35);return wavURL(a,R)}
function arm(){S.au=S.au||new Audio();S.au.src=wavURL(new Uint8Array(400).fill(128),4000);S.au.play().catch(()=>{})}

 if(S.ac===c.id)return;S.ac=c.id;const e=(now()-new Date(c.started_at))/1000;
 S.au.src=mkAlarm(c.limit_sec,S.cfg.warn_min*60);S.au.onloadedmetadata=()=>{try{S.au.currentTime=Math.min(e,c.limit_sec+80)}catch(x){}};S.au.play().catch(()=>{});

  if(S.role!=='pusat'&&!v.kamar.startsWith(S.daerah))return toast(`Kamar harus berawalan ${S.daerah}- (daerah Anda)`);
  const {error}=id?await sb.from('santri').update(v).eq('id',id):await sb.from('santri').insert(v);if(error)return toast(error.code==='23505'?'ID santri sudah dipakai':error.message);
  await audit(id?'UBAH SANTRI':'TAMBAH SANTRI',v.nama);el.remove();loadSantriPage()}}
function parseCSV(t){t=t.replace(/^\ufeff/,'');const l0=t.split('\n')[0];const d=[',',';','\t'].sort((a,b)=>l0.split(b).length-l0.split(a).length)[0];
 const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
async function impor(e){const f=e.target.files[0];if(!f)return;const rows=parseCSV(await f.text());if(rows.length<2)return toast('File kosong');
 const h=rows[0].map(x=>x.trim().toLowerCase().replace(/[\s-]+/g,'_')),ix=k=>h.indexOf(k);
 if(ix('id_santri')<0||ix('nama')<0)return toast('Baris pertama harus memuat kolom id_santri dan nama');
 const m={};let skip=0;rows.slice(1).forEach(r=>{const o={aktif:true};KOL.forEach(k=>o[k]=ix(k)<0?'':(r[ix(k)]||'').trim());o.kamar=o.kamar.toUpperCase();
  if(!o.id_santri||!o.nama)return;if(S.role!=='pusat'&&!o.kamar.startsWith(S.daerah)){skip++;return}m[o.id_santri]=o});
 const list=Object.values(m);if(!list.length)return toast('Tidak ada baris valid'+(skip?` (${skip} di luar daerah)`:''));
 if(!confirm(`Impor ${list.length} santri?${skip?`\n${skip} baris di luar daerah dilewati.`:''}`))return;toast('Mengimpor…');
 const ch=[];for(let i=0;i<list.length;i+=500)ch.push(list.slice(i,i+500));
 for(let i=0;i<ch.length;i+=4){const rs=await Promise.all(ch.slice(i,i+4).map(c=>sb.from('santri').upsert(c,{onConflict:'id_santri'})));const er=rs.find(r=>r.error);if(er)return toast('Gagal impor: '+er.error.message)}
 await audit('IMPOR SANTRI',list.length+' data');toast(list.length+' santri diimpor');santriTab()}
const tpl=()=>csv([KOL,['1001','Ahmad Fauzan','12','7A','Tsanawiyah','Surabaya','08123456789']],'template-santri.csv');
async function delS(id){if(!confirm('Nonaktifkan santri ini? Riwayat tetap tersimpan.'))return;const {error}=await sb.from('santri').update({aktif:false}).eq('id',id);if(error)return toast(error.message);await audit('NONAKTIF SANTRI','id '+id);loadSantriPage()}

/* ---------- RIWAYAT ---------- */
function riwayat(){$('#main').innerHTML=hd('Riwayat telepon','Semua panggilan, termasuk yang sedang berlangsung')+`<div class="row"><input id="rn" placeholder="Nama santri"><select id="rp"><option value="">Semua HP</option>${S.phones.map(p=>`<option value="${p.id}">${esc(p.nama)}</option>`).join('')}</select>${hPick('rh',true,false)}<button onclick="loadR()">Cari</button><button class="sec" onclick="exportR()">CSV</button></div><div class="sc" style="margin-top:14px"><table id="rt"></table></div>`;
 $('#rn').onkeydown=e=>{if(e.key==='Enter')loadR()};loadR()}
let RR=[];
async function loadR(){$('#rt').innerHTML='<tr><td class="mu">Memuat…</td></tr>';
 let q=sb.from('calls').select(`*,santri${$('#rn').value.trim()?'!inner':''}(id_santri,nama,kamar),phones(nama)`).order('started_at',{ascending:false}).limit(200);
 const n=$('#rn').value.trim().replace(/[%,()]/g,' '),p=$('#rp').value,d=hRange('rh');if(n)q=q.ilike('santri.nama','%'+n+'%');if(p)q=q.eq('phone_id',p);
 if(d)q=q.gte('started_at',new Date(d[0]).toISOString()).lt('started_at',new Date(d[1]).toISOString());
 const {data,error}=await q;if(error){$('#rt').innerHTML=`<tr><td>Gagal memuat riwayat: ${esc(error.message)}</td></tr>`;return}RR=(data||[]).map(r=>({...r,santri:r.santri||{id_santri:'-',nama:'(tidak diketahui)',kamar:'-'}}));
 const dr=r=>r.ended_at?fmt((new Date(r.ended_at)-new Date(r.started_at))/1000):fmt((now()-new Date(r.started_at))/1000);
 $('#rt').innerHTML='<tr><th>Waktu</th><th>Santri</th><th>HP</th><th>Tujuan</th><th>Durasi</th><th></th></tr>'+(RR.map(r=>`<tr><td>${tgl(r.started_at)}</td><td>${esc(r.santri.nama)}<br><span class="mu">${esc(r.santri.id_santri)} · Kmr ${esc(r.santri.kamar)}</span></td><td>${esc(r.phones&&r.phones.nama)}</td><td>${esc(r.tujuan)}${r.nomor?`<br><span class="mu">${esc(r.nomor)}</span>`:''}</td><td>${r.status==='batal'?'<span class="tag">Batal</span>':r.status==='aktif'?'<span class="tag r">Berlangsung</span>':dr(r)}${r.luar_jatah?' <span class="tag r" title="'+esc(r.alasan)+'">luar jatah</span>':''}</td><td>${r.status==='selesai'?`<button class="sec sm" onclick="koreksi(${r.id})">Koreksi</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">Belum ada riwayat untuk filter ini</td></tr>')}
function exportR(){csv([['Waktu','ID santri','Santri','Kamar','HP','Tujuan','Nomor','Durasi','Status','Alasan']].concat(RR.map(r=>[tgl(r.started_at),r.santri.id_santri,r.santri.nama,r.santri.kamar,r.phones&&r.phones.nama,r.tujuan,r.nomor,r.ended_at?fmt((new Date(r.ended_at)-new Date(r.started_at))/1000):'',r.status,r.alasan])),'riwayat-telepon.csv')}
async function koreksi(id){const r=RR.find(x=>x.id===id);const m=prompt('Durasi yang benar (menit, boleh desimal):');if(!m||isNaN(m))return;const a=prompt('Alasan koreksi (wajib):');if(!a||!a.trim())return;
 const {error}=await sb.from('calls').update({ended_at:new Date(new Date(r.started_at).getTime()+m*60000).toISOString()}).eq('id',id);if(error)return toast(error.message);await audit('KOREKSI',`${r.santri.nama}: durasi → ${m} menit. Alasan: ${a}`);loadR()}

/* ---------- REKAP ---------- */
function rekap(){const m=new Date(now());const v=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0');
 $('#main').innerHTML=hd('Rekap bulanan',S.role==='pusat'?'Semua daerah':'Daerah '+S.daerah,`<span class="row" style="flex:0 0 auto">${hPick('rm',false,true)}<button class="sec" onclick="exportK()">CSV</button></span>`)+'<div id="rk"><p class="mu">Memuat…</p></div>';['#rmm','#rmy'].forEach(k=>$(k).onchange=loadK);loadK()}
let KK=[];
async function loadK(){const [a0,b0]=hRange('rm'),a=new Date(a0),b=new Date(b0);
 const [k,c]=await Promise.all([sb.rpc('rekap_kamar',{p_from:a.toISOString(),p_to:b.toISOString(),p_quota:S.cfg.quota}),sb.from('calls').select('started_at,ended_at').eq('status','selesai').gte('started_at',a.toISOString()).lt('started_at',b.toISOString()).limit(10000)]);
 if(k.error){$('#rk').innerHTML=`<div class="card"><b>Rekap belum aktif</b><p class="mu">Jalankan file kada-daerah.sql di Supabase.<br>(${esc(k.error.message)})</p></div>`;return}
 const R=k.data||[],sum=R.reduce((t,x)=>({n:t.n+ +x.jumlah,f:t.f+ +x.penuh,o:t.o+ +x.sebagian,z:t.z+ +x.belum}),{n:0,f:0,o:0,z:0});
 let dur=0;(c.data||[]).forEach(r=>dur+=(new Date(r.ended_at)-new Date(r.started_at))/60000);
 KK=[['Kamar','Santri','Jatah penuh','Sebagian','Belum']].concat(R.map(x=>[x.kamar,x.jumlah,x.penuh,x.sebagian,x.belum]));
 $('#rk').innerHTML=`<div class="stats"><div><b>${sum.n.toLocaleString('id-ID')}</b><span>Total santri</span></div><div><b>${sum.f}</b><span>Jatah penuh</span></div><div><b>${sum.o}</b><span>Sebagian</span></div><div><b>${sum.z}</b><span>Belum telepon</span></div></div>
 <p class="mu">Total panggilan ${(c.data||[]).length} • Total durasi ${Math.round(dur)} menit</p><div class="sc"><table>${KK.map((r,i)=>'<tr>'+r.map(x=>i?`<td>${esc(x)}</td>`:`<th>${x}</th>`).join('')+'</tr>').join('')}</table></div>`}
const exportK=()=>csv(KK,'rekap-telepon.csv');

/* ---------- PENGATURAN ---------- */
async function setTab(){const {data:au}=await sb.from('audit').select('*').order('at',{ascending:false}).limit(30);const c=S.cfg,ro=S.role!=='pusat'?'disabled':'';
 $('#main').innerHTML=hd('Pengaturan',ro?'Aturan ini diatur oleh admin pusat':'Aturan telepon untuk semua daerah')+`<div class="card"><div class="fg"><label class="mu">Jatah per bulan Hijriyah (kali)<input id="cq" type="number" min="1" value="${c.quota}" ${ro}></label><label class="mu">Batas durasi (menit)<input id="cl" type="number" min="1" value="${c.limit_min}" ${ro}></label><label class="mu">Peringatan pada menit ke<input id="cw" type="number" min="1" value="${c.warn_min}" ${ro}></label><label class="mu">Koreksi tanggal Hijriyah<select id="ch" ${ro}>${[-1,0,1].map(v=>`<option value="${v}" ${(c.hijri_offset||0)===v?'selected':''}>${v>0?'+'+v:v} hari</option>`).join('')}</select></label></div>
 <div class="row" style="margin-top:16px">${ro?'':'<button onclick="saveCfg()">Simpan pengaturan</button>'}<button class="sec" onclick="logout()">${ic('out')}Keluar</button></div></div>
 <h3 class="sec-t">Log audit</h3><div class="sc"><table><tr><th>Waktu</th><th>Oleh</th><th>Aksi</th><th>Detail</th></tr>${(au||[]).map(a=>`<tr><td>${tgl(a.at)}</td><td>${esc(un(a.admin_email))}</td><td><span class="tag">${esc(a.aksi)}</span></td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td class="mu">Belum ada aktivitas</td></tr>'}</table></div>`}
async function saveCfg(){const v={quota:+$('#cq').value,limit_min:+$('#cl').value,warn_min:+$('#cw').value,hijri_offset:+$('#ch').value};if(v.warn_min>=v.limit_min)return toast('Peringatan harus lebih kecil dari batas');
 const {error}=await sb.from('settings').update(v).eq('id',1);if(error)return toast(error.message);Object.assign(S.cfg,v);await audit('UBAH PENGATURAN',JSON.stringify(v));toast('Pengaturan tersimpan')}

/* ---------- AKUN LOGIN ---------- */
let AK=[];const DR='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const rlTag=u=>u.role==='pusat'?'<span class="tag b">Admin Pusat</span>':u.role==='admin'?`<span class="tag b">Admin Daerah ${u.daerah}</span>`:`<span class="tag g">${esc(u.phone_nama||'HP')} · ${u.daerah||'?'}</span>`;
async function akun(){
 $('#main').innerHTML=hd('Akun login',S.role==='pusat'?'Admin pusat, admin tiap daerah, dan HP telepon':'Akun HP telepon daerah '+S.daerah,`<button onclick="akunForm()">${ic('plus')}Tambah akun</button>`)+'<div id="ak" class="sc"><p class="mu">Memuat…</p></div>';
 const {data,error}=await sb.rpc('admin_list_users');
 if(error){$('#ak').innerHTML=`<div class="card"><b>Fitur akun belum aktif</b><p class="mu">Jalankan file kada-daerah.sql di Supabase › SQL Editor, lalu muat ulang.<br>(${esc(error.message)})</p></div>`;return}
 AK=data||[];
 $('#ak').innerHTML='<table><tr><th>Username</th><th>Jenis</th><th>Terakhir masuk</th><th></th></tr>'+(AK.map(u=>`<tr><td><b>${esc(un(u.email))}</b></td><td>${rlTag(u)}</td><td>${u.last_sign_in_at?tgl(u.last_sign_in_at):'<span class="mu">Belum pernah</span>'}</td><td style="white-space:nowrap;text-align:right"><button class="sec sm" onclick="akunForm('${u.id}')">Ubah</button> <button class="sec sm" onclick="delAk('${u.id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan=4 class="mu">Belum ada akun</td></tr>')+'</table>'}
function akunForm(id){const u=AK.find(x=>x.id===id)||{},ed=!!id,pu=S.role==='pusat';const el=document.createElement('div');el.className='md';document.body.appendChild(el);
 const roles=pu?[['admin','Admin daerah (mengelola HP daerahnya)'],['terminal','HP telepon'],['pusat','Admin pusat (mengelola semua)']]:[['terminal','HP telepon']];
 el.innerHTML=`<div><h2>${ed?'Ubah akun':'Tambah akun'}</h2>
 <label class="mu">Jenis akun<select id="ar" ${ed?'disabled':''}>${roles.map(([v,l])=>`<option value="${v}" ${(u.role||'terminal')===v?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="mu" id="adw">Daerah<select id="ad">${DR.map(d=>`<option ${(u.daerah||'')===d?'selected':''}>${d}</option>`).join('')}</select></label>
 <label class="mu">Username<input id="au" value="${esc(ed?un(u.email):'')}" placeholder="contoh: hp-a1" autocapitalize="none"></label>
 <label class="mu" id="anw">Nama HP (tampil di dashboard)<input id="an" value="${esc(u.phone_nama||'')}" placeholder="contoh: HP A1"></label>
 <label class="mu">Password${ed?' baru (kosongkan jika tidak diubah)':''}<input id="ap" placeholder="minimal 6 karakter"></label>
 <div class="row" style="margin-top:18px"><button class="sec" onclick="this.closest('.md').remove()">Batal</button><button id="as" style="flex:1">Simpan</button></div></div>`;
 const g=k=>el.querySelector(k),sh=()=>{const r=g('#ar').value;g('#anw').style.display=r==='terminal'?'block':'none';g('#adw').style.display=pu&&r!=='pusat'?'block':'none'};g('#ar').onchange=sh;sh();
 g('#as').onclick=async()=>{const u0=g('#au').value.trim(),pw=g('#ap').value,nm=g('#an').value.trim(),rl=g('#ar').value;
  if(!u0)return toast('Username wajib diisi');if((!ed||pw)&&pw.length<6)return toast('Password minimal 6 karakter');const em=mail(u0),dr=pu&&rl!=='pusat'?g('#ad').value:null;
  const {error}=ed?await sb.rpc('admin_update_user',{p_id:id,p_email:em,p_password:pw||null,p_nama:nm||null,p_daerah:dr}):await sb.rpc('admin_create_user',{p_email:em,p_password:pw,p_role:rl,p_nama:nm||null,p_daerah:dr});
  if(error)return toast(error.message);await audit(ed?'UBAH AKUN':'TAMBAH AKUN',em+(dr?' • daerah '+dr:''));el.remove();toast('Akun tersimpan');await refreshActive(true);akun()}}
async function delAk(id){const u=AK.find(x=>x.id===id);if(!confirm(`Hapus akun ${un(u.email)}? Akun ini tidak bisa masuk lagi.`))return;
 const {error}=await sb.rpc('admin_delete_user',{p_id:id});if(error)return toast(error.message);await audit('HAPUS AKUN',u.email);toast('Akun dihapus');await refreshActive(true);akun()}

boot();
</script>
