function tick(){
 document.querySelectorAll('.t[data-s]').forEach(el=>{const e=(now()-new Date(el.dataset.s))/1000;el.textContent=fmt(e);const c=el.closest('.ph'),rt=c||el.closest('.tm'),bi=rt&&rt.querySelector('.bar i');if(bi)bi.style.width=Math.min(100,e/+el.dataset.l*100)+'%';if(c){const l=+el.dataset.l;c.classList.toggle('over',e>=l);c.classList.toggle('warn',e>=S.cfg.warn_min*60&&e<l);const pl=c.querySelector('.pill');if(pl)pl.textContent=e>=l?'Batas lewat':e>=S.cfg.warn_min*60?'Hampir batas':'Sedang telepon'}});
 for(const c of S.active){const e=(now()-new Date(c.started_at))/1000;
  if(S.role!=='terminal'){const k1='w'+c.id,k2='l'+c.id;
   if(e>=S.cfg.warn_min*60&&e<c.limit_sec&&!S.alerted[k1]){S.alerted[k1]=1;toast(`🟠 ${c.phones.nama}: ${c.santri.nama} hampir batas`);beep(1)}
   if(e>=c.limit_sec&&!S.alerted[k2]){S.alerted[k2]=1;toast(`🔔 ${c.phones.nama}: ${c.santri.nama} mencapai batas ${fmt(c.limit_sec)}`);beep(3)}}
  else if(myPhone()&&c.phone_id===myPhone().id){wd(c,e);
   const tm=$('#tm');if(tm){tm.classList.toggle('warn',e>=S.cfg.warn_min*60&&e<c.limit_sec);tm.classList.toggle('over',e>=c.limit_sec);
    const al=$('#al');if(al)al.textContent=e>=c.limit_sec?'⚠️ WAKTU '+fmt(c.limit_sec)+' TELAH TERCAPAI':e>=S.cfg.warn_min*60?'Waktu hampir habis':'';
    if(e>=c.limit_sec){const q=e-c.limit_sec,cy=c.id+'-'+Math.floor(q/8);if(q%8>=2.2&&S.vc!==cy&&!window.KadaNative){S.vc=cy;sayDone(c)}vibOn(c)}}}}}

const wavURL=(a,R)=>{const h=new DataView(new ArrayBuffer(44)),w=(o,t)=>[...t].forEach((c,i)=>h.setUint8(o+i,c.charCodeAt(0)));

/* Satu file audio: hening sampai batas waktu, lalu bunyi beep berulang. Diputar sejak telepon dimulai sehingga tetap berjalan sebagai pemutar media saat aplikasi lain dibuka. */

try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}

function mkAlarm(limit,warn){const R=8000,tot=Math.ceil(limit)+300,a=new Uint8Array(R*tot).fill(128);for(let i=0;i<a.length;i+=2)a[i]=129;
 const beep=(t0,d)=>{for(let i=0;i<R*d;i++){const n=Math.floor(t0*R)+i;if(n<a.length)a[n]=128+(Math.sin(2*Math.PI*1000*i/R)>=0?115:-115)}};

/* Pengawas: jika audio terhenti (mis. direbut aplikasi lain) lanjutkan & sinkronkan lagi; jika diblokir, bunyikan lewat WebAudio */
function wd(c,e){if(window.KadaNative||!S.au||S.ac!==c.id)return;const want=Math.min(e,c.limit_sec+290);

function syncAudio(c){

 if(!c){S.vibId=null;try{navigator.vibrate&&navigator.vibrate(0)}catch(x){}if(S.ac!==null){S.au.pause();S.ac=null}return}
 if(S.ac===c.id)return;S.ac=c.id;const e=(now()-new Date(c.started_at))/1000;

function parseCSV(t){t=t.replace(/^\ufeff/,'');const l0=t.split('\n')[0];const d=[',',';','\t'].sort((a,b)=>l0.split(b).length-l0.split(a).length)[0];

  else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}

async function refresh(){toast('Memuat ulang data…','i');try{await loadBase()}catch(e){}render()}
const lisan=n=>String(n||'').replace(/['’`]/g,'').replace(/\b(MOH|MOCH|MUH|MHD|M)\.?(?=\s)/gi,'Muhammad').replace(/\bABD\.?(?=\s)/gi,'Abdul').replace(/\./g,' ').replace(/\s+/g,' ').trim().toLowerCase().split(' ').filter(Boolean).slice(0,3).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||'santri';
const msgFor=c=>`Saudara ${lisan(c&&c.santri&&c.santri.nama)}, waktu telepon Anda sudah habis, terima kasih.`;
function testAlarm(){const t=msgFor({santri:{nama:'MOH. CONTOH'}});
 if(window.KadaNative){try{KadaNative.schedule(String(Date.now()+10000),t)}catch(e){toast('Gagal: '+e,'e')}return}
 toast('Tes alarm: bunyi, getar, lalu suara','i');try{beep(3)}catch(e){}try{navigator.vibrate&&navigator.vibrate([500,300,500,300,500])}catch(e){}
 setTimeout(()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';if(VO)u.voice=VO;speechSynthesis.speak(u)}catch(e){}},2300)}
function stopAlarm(){try{window.KadaNative&&KadaNative.cancel()}catch(e){}try{speechSynthesis.cancel();navigator.vibrate&&navigator.vibrate(0)}catch(e){}toast('Alarm dihentikan','s')}
/* perintah admin → HP */
const tl=(p,s)=>{const off=s.k==='off'?'disabled title="HP sedang offline"':'';return `<div class="tl"><button class="sec sm" ${off} onclick="cmdHp(${p.id},'test')">🔔 Tes alarm &amp; getar</button><button class="sec sm" ${off} onclick="cmdHp(${p.id},'stop')">⏹ Hentikan</button><button class="sec sm" onclick="lockHp(${p.id},${p.locked?'false':'true'})">${p.locked?'🔓 Buka kunci':'🔒 Kunci HP'}</button></div>`};
async function cmdHp(id,cmd){const p=S.phones.find(x=>x.id===id);const {error}=await sb.from('phones').update({cmd,cmd_at:new Date(now()).toISOString()}).eq('id',id);
 if(error)return toast('Gagal mengirim perintah: '+error.message,'e');toast(cmd==='test'?`Tes dikirim ke ${p.nama}. Alarm, getar, dan suara muncul sekitar 10 detik lagi.`:`Perintah hentikan alarm dikirim ke ${p.nama}.`,'s')}
async function lockHp(id,on){const p=S.phones.find(x=>x.id===id);const {error}=await sb.from('phones').update({locked:on}).eq('id',id);
 if(error)return toast('Gagal mengubah kunci: '+error.message,'e');p.locked=on;await audit(on?'KUNCI HP':'BUKA KUNCI HP',p.nama);toast(on?`${p.nama} dikunci. Keluar dari aplikasi di HP itu kini meminta password.`:`${p.nama} dibuka kuncinya.`,'s');dash()}
function runCmd(p){if(!p||!p.cmd||!p.cmd_at)return;const at=+new Date(p.cmd_at);if(S.cmdAt===at)return;S.cmdAt=at;if(Math.abs(now()-at)>30000)return;if(p.cmd==='test')testAlarm();else if(p.cmd==='stop')stopAlarm()}
function applyLock(p){const on=!!(p&&p.locked);document.body.dataset.locked=on?1:0;if(S.lk!==on){S.lk=on;try{window.KadaNative&&KadaNative.lock(on)}catch(e){}}}
boot();
</script>
</body>
</html>
